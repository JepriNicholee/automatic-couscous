# Dipicu oleh tool build_apk di aplikasi (git push). Artifact 'mythos-debug' diunduh balik oleh skrip tools/build-github.sh.
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Run lama hanya dibatalkan untuk pull request. Untuk push TIDAK: tool build_apk menunggu run milik commit-nya sendiri,
# dan pembatalan oleh push berikutnya akan tampak sebagai build gagal.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Token bawaan hanya boleh membaca isi repo (rahasia keystore tetap dipakai lewat secrets).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Siapkan Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # APK debug wajib memakai signing key yang sama dengan APK MYTHOS 2.40.
      # Jika secret tidak tersedia atau fingerprint salah, hentikan build agar tidak
      # menghasilkan APK debug bertanda tangan lain yang tidak bisa memperbarui aplikasi lama.
      - name: Siapkan dan verifikasi keystore MYTHOS
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::GitHub Secrets KEYSTORE_B64 dan/atau KEYSTORE_PASSWORD belum tersedia."
            exit 1
          fi

          KEYSTORE_FILE="signing-key.p12"
          KEY_ALIAS="androiddebugkey"
          EXPECTED_SHA256="6D:7C:50:0F:41:CE:A2:E2:F7:02:35:7E:B8:47:88:DD:49:4E:06:F5:F1:2A:A3:4B:E7:B3:D2:CA:C1:13:F1:FF"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          ACTUAL_SHA256="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Fingerprint keystore tidak cocok dengan APK MYTHOS 2.40."
            exit 1
          fi

          # Uji akses private key; password key sudah diverifikasi sama dengan store password.
          keytool -certreq -alias "$KEY_ALIAS" -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -file /dev/null >/dev/null 2>&1

          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_FILE" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > keystore.properties
          chmod 600 keystore.properties
          echo "Keystore valid: alias dan fingerprint cocok dengan APK MYTHOS 2.40."

      # APK dibangun dan diunggah DULU supaya hasilnya tetap ada walau ada tes yang gagal; tes dijalankan sesudahnya
      # dan kegagalannya tetap membuat job merah.
      - name: Build APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: mythos-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Jalankan tes unit
        run: ./gradlew testDebugUnitTest --no-daemon

      # Laporan tes selalu diunggah (juga saat gagal) agar penyebab bisa dibaca tanpa mengulang build.
      - name: Unggah laporan tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes-unit
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # Lint tidak menggagalkan job (belum ada baseline); hasilnya dipakai untuk membersihkan temuan bertahap.
      - name: Jalankan lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Unggah laporan lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
